name: GoRest API CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Newman
      run: npm install -g newman

    - name: Run Postman Collection via Newman
      run: |
        newman run collection.json \
          -d users.csv \
          --env-var "token=08dda69e044b9007c3c8ea23ff76d2a6a82b20369f8c15d1e5e1965e4a7cedc" \
          --env-var "userid=1"
